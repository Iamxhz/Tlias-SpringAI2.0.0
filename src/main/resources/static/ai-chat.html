<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能助手 - Tlias</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'chat-bg': '#f7f7f8',
                        'bubble-user': '#2563eb',
                        'bubble-ai': '#ffffff',
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome 图标 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ===== 滚动条美化 ===== */
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 3px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }

        /* ===== 打字机光标动画 ===== */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        .typing-cursor::after {
            content: '▍';
            animation: blink 1s ease-in-out infinite;
            color: #374151;
        }

        /* ===== 消息入场动画 ===== */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .message-enter {
            animation: slideUp 0.3s ease-out;
        }

        /* ===== 思考中三个点跳动 ===== */
        @keyframes bounce-dot {
            0%, 80%, 100% { transform: scale(0.4); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }
        .thinking-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #9ca3af;
            animation: bounce-dot 1.4s ease-in-out infinite;
        }
        .thinking-dot:nth-child(1) { animation-delay: 0s; }
        .thinking-dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking-dot:nth-child(3) { animation-delay: 0.4s; }

        /* ===== 输入框焦点光晕 ===== */
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* ===== HTML 内容样式 ===== */
        .ai-message-content pre {
            background: #1e293b;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 12px 16px;
            overflow-x: auto;
            font-size: 0.875rem;
            line-height: 1.6;
        }
        .ai-message-content code {
            background: #f1f5f9;
            color: #e11d48;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.875em;
        }
        .ai-message-content pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }
        .ai-message-content p {
            margin-bottom: 0.5em;
        }
        .ai-message-content p:last-child {
            margin-bottom: 0;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

    <!-- ==================== 主容器 ==================== -->
    <div class="w-full max-w-3xl h-[92vh] bg-white rounded-2xl shadow-2xl flex flex-col overflow-hidden">

        <!-- ========== 顶部标题栏 ========== -->
        <header class="flex items-center justify-between px-6 py-4 bg-white border-b border-gray-100 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-200">
                    <i class="fa-solid fa-robot text-white text-lg"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-gray-800 leading-tight">班主任 Agent</h1>
                    <p class="text-xs text-gray-400">工具时间线 · TOOL_START / TOOL_RESULT</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button
                    id="newSessionBtn"
                    class="px-3 py-1.5 rounded-full bg-gray-100 text-gray-600 text-xs font-medium hover:bg-gray-200 transition"
                    title="开启新会话（清空本页记忆隔离 ID）"
                >
                    新会话
                </button>
                <span id="sessionBadge" class="hidden sm:inline-flex px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 text-xs font-mono max-w-[140px] truncate" title="conversationId"></span>
                <span id="statusIndicator" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-green-50 text-green-600 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-green-500"></span>
                    在线
                </span>
            </div>
        </header>

        <section class="shrink-0 px-6 py-3 bg-slate-50 border-b border-gray-100">
            <div class="flex flex-col gap-2 sm:flex-row sm:items-center">
                <input
                    id="tokenInput"
                    type="text"
                    placeholder="先粘贴登录 token，再调用 /ai/chat"
                    class="flex-1 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm text-slate-700 outline-none input-glow"
                />
                <button
                    id="saveTokenBtn"
                    type="button"
                    class="rounded-xl bg-slate-800 px-4 py-2 text-sm text-white hover:bg-slate-900 transition"
                >
                    保存 Token
                </button>
            </div>
            <p class="mt-2 text-xs text-slate-500">AI 接口已接入 JWT。请先登录拿到 token，再保存到本页用于聊天和审批请求。</p>
        </section>

        <!-- ========== 聊天消息区 ========== -->
        <main id="chatContainer" class="flex-1 overflow-y-auto chat-scroll px-4 py-6 space-y-6 bg-gray-50">

            <!-- 欢迎消息将由 JS 动态插入 -->

        </main>

        <!-- ========== 底部输入栏 ========== -->
        <footer class="shrink-0 bg-white border-t border-gray-100 px-4 py-4">
            <div class="max-w-2xl mx-auto space-y-2">
                <!-- 消息输入行 -->
                <div class="flex items-end gap-3">
                <input id="evidenceInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" class="hidden" />
                <button
                    id="attachBtn"
                    type="button"
                    class="shrink-0 w-11 h-11 rounded-2xl bg-slate-100 text-slate-600 flex items-center justify-center hover:bg-slate-200 active:scale-95 transition-all"
                    title="上传违纪证据图"
                >
                    <i class="fa-solid fa-image"></i>
                </button>
                <!-- 输入框 -->
                <div class="flex-1 relative">
                    <textarea
                        id="messageInput"
                        rows="1"
                        placeholder="输入消息或附上违纪证据图，Enter 发送..."
                        class="w-full resize-none rounded-2xl border border-gray-200 bg-gray-50 px-4 py-3 pr-12 text-sm text-gray-800 placeholder-gray-400 outline-none transition-all input-glow"
                        style="max-height: 150px;"
                    ></textarea>
                    <!-- 清空按钮 (输入时显示) -->
                    <button
                        id="clearBtn"
                        class="hidden absolute right-3 top-1/2 -translate-y-1/2 w-6 h-6 rounded-full bg-gray-300 text-white flex items-center justify-center hover:bg-gray-400 transition text-xs"
                        title="清空"
                    >
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <!-- 发送按钮 -->
                <button
                    id="sendBtn"
                    class="shrink-0 w-11 h-11 rounded-2xl bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 active:scale-95 transition-all shadow-lg shadow-blue-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100"
                >
                    <i id="sendIcon" class="fa-solid fa-paper-plane"></i>
                    <i id="loadingIcon" class="fa-solid fa-circle-notch fa-spin hidden"></i>
                </button>
            </div>
                <div id="evidencePreview" class="hidden items-center gap-2 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                    <img id="evidenceThumb" alt="证据预览" class="h-12 w-12 rounded-lg object-cover" />
                    <div class="flex-1 min-w-0">
                        <div class="text-xs font-medium text-slate-700">违纪证据图</div>
                        <div id="evidenceName" class="text-xs text-slate-400 truncate"></div>
                    </div>
                    <button id="removeEvidenceBtn" type="button" class="text-xs text-slate-500 hover:text-red-500">移除</button>
                </div>
                </div>
            <p class="text-center text-xs text-gray-400 mt-2">
                POST /ai/chat · 证据图视觉识别 · HITL 确认
            </p>
        </footer>
    </div>

    <!-- ==================== 核心脚本 ==================== -->
    <script>
        (function() {
            // ========== DOM 引用 ==========
            const chatContainer = document.getElementById('chatContainer');
            const messageInput = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const sendIcon = document.getElementById('sendIcon');
            const loadingIcon = document.getElementById('loadingIcon');
            const clearBtn = document.getElementById('clearBtn');
            const statusIndicator = document.getElementById('statusIndicator');
            const newSessionBtn = document.getElementById('newSessionBtn');
            const sessionBadge = document.getElementById('sessionBadge');
            const tokenInput = document.getElementById('tokenInput');
            const saveTokenBtn = document.getElementById('saveTokenBtn');
            const evidenceInput = document.getElementById('evidenceInput');
            const attachBtn = document.getElementById('attachBtn');
            const evidencePreview = document.getElementById('evidencePreview');
            const evidenceThumb = document.getElementById('evidenceThumb');
            const evidenceName = document.getElementById('evidenceName');
            const removeEvidenceBtn = document.getElementById('removeEvidenceBtn');

            const CONVERSATION_KEY = 'tlias_teacher_conversation_id';
            const TOKEN_KEY = 'tlias_teacher_token';

            // ========== 状态管理 ==========
            let isStreaming = false;
            let currentAiBubble = null;
            let conversationId = localStorage.getItem(CONVERSATION_KEY) || '';
            let accessToken = localStorage.getItem(TOKEN_KEY) || '';
            let pendingFollowUp = null; // 确认扣分后，等当前流结束再自动追问 Agent
            let pendingEvidence = null; // { file, previewUrl }

            function ensureConversationId() {
                if (!conversationId) {
                    conversationId = 'teacher-' + Math.random().toString(16).slice(2, 14);
                    localStorage.setItem(CONVERSATION_KEY, conversationId);
                }
                sessionBadge.textContent = conversationId;
                sessionBadge.title = 'conversationId: ' + conversationId;
                return conversationId;
            }

            function resetConversation() {
                conversationId = 'teacher-' + Math.random().toString(16).slice(2, 14);
                localStorage.setItem(CONVERSATION_KEY, conversationId);
                sessionBadge.textContent = conversationId;
                sessionBadge.title = 'conversationId: ' + conversationId;
                chatContainer.innerHTML = '';
                addWelcomeMessage();
            }

            function saveToken() {
                accessToken = tokenInput.value.trim();
                if (!accessToken) {
                    localStorage.removeItem(TOKEN_KEY);
                    return false;
                }
                localStorage.setItem(TOKEN_KEY, accessToken);
                return true;
            }

            function looksLikeJwt(value) {
                return typeof value === 'string' && /^[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+\.[A-Za-z0-9-_]+$/.test(value);
            }

            function guessExistingJwt() {
                try {
                    const queryToken = new URLSearchParams(window.location.search).get('token');
                    if (looksLikeJwt(queryToken)) {
                        return queryToken;
                    }

                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        const value = key ? localStorage.getItem(key) : null;
                        if (looksLikeJwt(value)) {
                            return value;
                        }
                    }
                } catch (e) {
                    console.warn('自动探测 token 失败:', e);
                }
                return '';
            }

            function getToken() {
                const token = (tokenInput.value || '').trim() || accessToken;
                if (!token) {
                    throw new Error('请先登录系统并在页面顶部保存 token。');
                }
                return token;
            }

            function getAuthHeaders() {
                return {
                    'Content-Type': 'application/json',
                    'token': getToken()
                };
            }

            function setEvidenceFile(file) {
                if (pendingEvidence && pendingEvidence.previewUrl) {
                    URL.revokeObjectURL(pendingEvidence.previewUrl);
                }
                if (!file) {
                    pendingEvidence = null;
                    evidenceInput.value = '';
                    evidencePreview.classList.add('hidden');
                    evidencePreview.classList.remove('flex');
                    return;
                }
                const previewUrl = URL.createObjectURL(file);
                pendingEvidence = { file, previewUrl };
                evidenceThumb.src = previewUrl;
                evidenceName.textContent = file.name + ' · ' + Math.max(1, Math.round(file.size / 1024)) + ' KB';
                evidencePreview.classList.remove('hidden');
                evidencePreview.classList.add('flex');
            }

            function hideEvidencePreview() {
                pendingEvidence = null;
                evidenceInput.value = '';
                evidencePreview.classList.add('hidden');
                evidencePreview.classList.remove('flex');
            }

            function fileToDataUrl(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = () => reject(new Error('读取证据图失败'));
                    reader.readAsDataURL(file);
                });
            }

            async function parseJsonResponse(response, fallbackMsg) {
                const raw = await response.text();
                if (!raw) {
                    throw new Error(fallbackMsg + '（空响应 HTTP ' + response.status + '）');
                }
                const trimmed = raw.trim();
                if (trimmed.startsWith('<')) {
                    throw new Error(fallbackMsg + '：接口返回了网页而不是 JSON，请确认请求打到 tlias 后端（/ai/**）。');
                }
                try {
                    return JSON.parse(trimmed);
                } catch (e) {
                    throw new Error(fallbackMsg + '：无法解析响应。');
                }
            }

            async function uploadEvidence(file) {
                const form = new FormData();
                form.append('file', file);
                const response = await fetch('/ai/upload', {
                    method: 'POST',
                    headers: { token: getToken() },
                    body: form
                });
                if (response.status === 401) {
                    throw new Error('未登录或 token 已失效，请重新登录并更新页面顶部 token。');
                }
                const body = await parseJsonResponse(response, '证据图上传失败');
                if (!response.ok || body.code === 0 || !body.data) {
                    throw new Error(body.msg || ('上传失败 HTTP ' + response.status));
                }
                return body.data;
            }

            // ========== 工具函数 ==========
            function scrollToBottom(smooth = true) {
                if (smooth) {
                    chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                } else {
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            }

            function formatTime() {
                const now = new Date();
                return now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }

            function escapeHtml(text) {
                const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
                return text.replace(/[&<>"']/g, c => map[c]);
            }

            // 简易 Markdown → HTML（处理代码块、行内代码、粗体、换行）
            function simpleMarkdownToHtml(text) {
                let html = escapeHtml(text);
                // 代码块 ```
                html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                    return `<pre><code>${code.trim()}</code></pre>`;
                });
                // 行内代码 ``
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
                // 粗体 **
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                // 换行
                html = html.replace(/\n/g, '<br>');
                return html;
            }

            // ========== 创建消息气泡 ==========
            function createBubble(role, content = '') {
                const wrapper = document.createElement('div');
                wrapper.className = `flex gap-3 message-enter ${role === 'user' ? 'flex-row-reverse' : ''}`;

                // 头像
                const avatar = document.createElement('div');
                avatar.className = `w-9 h-9 rounded-xl shrink-0 flex items-center justify-center text-sm shadow-md ${
                    role === 'user'
                        ? 'bg-gradient-to-br from-blue-500 to-indigo-600 text-white'
                        : 'bg-gradient-to-br from-emerald-400 to-teal-500 text-white'
                }`;
                avatar.innerHTML = role === 'user'
                    ? '<i class="fa-solid fa-user"></i>'
                    : '<i class="fa-solid fa-robot"></i>';

                // 气泡体
                const body = document.createElement('div');
                body.className = `flex flex-col max-w-[75%] ${role === 'user' ? 'items-end' : 'items-start'}`;

                // 气泡内容
                const bubble = document.createElement('div');
                bubble.className = `px-4 py-3 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap break-words ${
                    role === 'user'
                        ? 'bg-blue-600 text-white rounded-br-md'
                        : 'bg-white border border-gray-200 text-gray-800 rounded-bl-md shadow-sm ai-message-content'
                }`;
                bubble.innerHTML = content;

                // 时间
                const time = document.createElement('span');
                time.className = 'text-xs text-gray-400 mt-1 px-1';
                time.textContent = formatTime();

                // 组装
                body.appendChild(bubble);
                body.appendChild(time);
                wrapper.appendChild(avatar);
                wrapper.appendChild(body);

                return { wrapper, bubble, time };
            }

            // ========== 添加用户消息 ==========
            function addUserMessage(text, imageUrl) {
                const html = (imageUrl
                    ? '<img src="' + escapeHtml(imageUrl) + '" alt="证据图" class="mb-2 max-h-40 rounded-lg object-cover">'
                    : '') + escapeHtml(text || '请根据证据图按规章扣分');
                const { wrapper } = createBubble('user', html);
                chatContainer.appendChild(wrapper);
                scrollToBottom();
            }

            // ========== 添加 AI 欢迎消息 (静态) ==========
            function addWelcomeMessage() {
                const { wrapper, bubble } = createBubble('assistant');
                bubble.innerHTML = simpleMarkdownToHtml(
                    '你好！我是 **班主任 Agent**。\n\n' +
                    '使用前请先在顶部粘贴登录 `token`。\n\n' +
                    '可以打字，也可以点左侧图片按钮上传**违纪证据图**。\n\n' +
                    '查询示例：「有哪些员工」「Java 班有哪些学员」「各班人数」。写操作仍会弹出确认卡。'
                );
                chatContainer.appendChild(wrapper);
                scrollToBottom(false);
            }

            /** 在消息流上方展示一次运行的生命周期提示 */
            function addRunMeta(text) {
                const el = document.createElement('div');
                el.className = 'text-center text-xs text-slate-400 font-mono message-enter';
                el.textContent = text;
                chatContainer.appendChild(el);
                scrollToBottom();
                return el;
            }

            /** 工具调用时间线（TOOL_START / TOOL_RESULT） */
            function showVisionResult(event) {
                const el = document.createElement('div');
                el.className = 'mx-auto max-w-lg message-enter rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-2 text-xs text-indigo-900';
                el.innerHTML = '<div class="font-semibold mb-1"><i class="fa-solid fa-eye mr-1"></i>视觉识别</div>' +
                    '<div class="font-mono whitespace-pre-wrap break-words">' + escapeHtml(event.content || '') + '</div>';
                chatContainer.appendChild(el);
                scrollToBottom();
            }

            function showToolTimeline(event) {
                const el = document.createElement('div');
                const isStart = event.type === 'TOOL_START';
                el.className = 'mx-auto max-w-lg message-enter rounded-lg border px-3 py-2 text-xs font-mono ' +
                    (isStart
                        ? 'border-sky-200 bg-sky-50 text-sky-800'
                        : 'border-violet-200 bg-violet-50 text-violet-800');
                const icon = isStart ? '🔧' : '📤';
                const label = isStart ? 'TOOL_START' : 'TOOL_RESULT';
                const name = event.toolName || 'unknown';
                const detail = event.content ? (' · ' + event.content) : '';
                el.textContent = icon + ' ' + label + ' · ' + name + detail;
                chatContainer.appendChild(el);
                scrollToBottom();
                return el;
            }

            // ========== 创建 AI 气泡（流式写入目标） ==========
            function createAiStreamBubble() {
                const { wrapper, bubble } = createBubble('assistant', '');
                bubble.classList.add('typing-cursor'); // 打字光标
                chatContainer.appendChild(wrapper);
                scrollToBottom();
                return { wrapper, bubble };
            }

            // 移除打字光标
            function finishAiBubble(bubble) {
                bubble.classList.remove('typing-cursor');
            }

            // ========== Loading / 状态切换 ==========
            function setLoading(isLoading) {
                isStreaming = isLoading;
                if (isLoading) {
                    sendBtn.disabled = true;
                    if (attachBtn) attachBtn.disabled = true;
                    sendIcon.classList.add('hidden');
                    loadingIcon.classList.remove('hidden');
                    messageInput.disabled = true;
                    statusIndicator.innerHTML = `
                        <span class="flex items-center gap-1.5 text-yellow-600 bg-yellow-50 px-3 py-1.5 rounded-full text-xs font-medium">
                            <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse"></span>
                            响应中...
                        </span>
                    `;
                } else {
                    sendBtn.disabled = false;
                    if (attachBtn) attachBtn.disabled = false;
                    sendIcon.classList.remove('hidden');
                    loadingIcon.classList.add('hidden');
                    messageInput.disabled = false;
                    messageInput.focus();
                    statusIndicator.innerHTML = `
                        <span class="flex items-center gap-1.5 text-green-600 bg-green-50 px-3 py-1.5 rounded-full text-xs font-medium">
                            <span class="w-2 h-2 rounded-full bg-green-500"></span>
                            在线
                        </span>
                    `;
                }
            }

            // 显示 AI 正在思考的三个点
            function showThinkingDots(bubbleElement) {
                bubbleElement.innerHTML =
                    '<span class="thinking-dot"></span>' +
                    '<span class="thinking-dot"></span>' +
                    '<span class="thinking-dot"></span>';
            }

            // ========== 构建请求载荷（业务上下文由 @Tool 自动提取） ==========
            function buildPayload(text, imageUrl, imageBase64) {
                const payload = {
                    message: text,
                    conversationId: ensureConversationId()
                };
                if (imageUrl) {
                    payload.imageUrl = imageUrl;
                }
                if (imageBase64) {
                    payload.imageBase64 = imageBase64;
                }
                return payload;
            }

            /** 尝试把 SSE data 解析为 AgentEvent；失败则当作旧版纯文本 */
            function parseAgentEvent(raw) {
                try {
                    const obj = typeof raw === 'string' ? JSON.parse(raw) : raw;
                    if (obj && obj.type && obj.runId) {
                        return obj;
                    }
                } catch (e) {
                    // ignore
                }
                return null;
            }

            function getApprovalUiMeta(event) {
                const tool = event.toolName || '';
                const idText = escapeHtml(event.approvalId || '');
                const table = {
                    deleteEmpByIds: { confirmText: '确认删除', rejectText: '取消删除', approvedFollowUpPrefix: '班主任已确认删除员工。', detailText: idText },
                    saveEmp: { confirmText: '确认入职', rejectText: '取消入职', approvedFollowUpPrefix: '班主任已确认员工入职。', detailText: idText },
                    saveDept: { confirmText: '确认新增部门', rejectText: '取消', approvedFollowUpPrefix: '班主任已确认新增部门。', detailText: idText },
                    updateDept: { confirmText: '确认修改部门', rejectText: '取消', approvedFollowUpPrefix: '班主任已确认修改部门。', detailText: idText },
                    deleteDept: { confirmText: '确认删除部门', rejectText: '取消', approvedFollowUpPrefix: '班主任已确认删除部门。', detailText: idText },
                    setAlarm: { confirmText: '确认设置闹钟', rejectText: '取消', approvedFollowUpPrefix: '班主任已确认设置闹钟。', detailText: idText }
                };
                if (table[tool]) {
                    return table[tool];
                }
                return {
                    confirmText: '确认扣分',
                    rejectText: '取消',
                    approvedFollowUpPrefix: '班主任已确认扣分。',
                    detailText: `studentId=${escapeHtml(String(event.studentId ?? ''))} · score=${escapeHtml(String(event.score ?? ''))} · ${idText}`
                };
            }

            /** 渲染通用审批确认卡 */
            function showApprovalCard(event) {
                const uiMeta = getApprovalUiMeta(event);
                const card = document.createElement('div');
                card.className = 'mx-auto max-w-md message-enter rounded-xl border border-amber-200 bg-amber-50 px-4 py-3 shadow-sm';
                card.dataset.approvalId = event.approvalId;
                card.dataset.toolName = event.toolName || '';

                card.innerHTML = `
                    <div class="text-sm font-semibold text-amber-800 mb-1">
                        <i class="fa-solid fa-shield-halved mr-1"></i>需要班主任确认
                    </div>
                    <div class="text-sm text-amber-900 mb-3">
                        ${escapeHtml(event.content || '')}<br>
                        <span class="text-xs text-amber-700 font-mono">
                            ${uiMeta.detailText}
                        </span>
                    </div>
                    <div class="flex gap-2">
                        <button type="button" class="approve-btn flex-1 rounded-lg bg-amber-600 text-white text-sm py-2 hover:bg-amber-700">
                            ${uiMeta.confirmText}
                        </button>
                        <button type="button" class="reject-btn flex-1 rounded-lg bg-white border border-amber-300 text-amber-800 text-sm py-2 hover:bg-amber-100">
                            ${uiMeta.rejectText}
                        </button>
                    </div>
                `;

                const approveBtn = card.querySelector('.approve-btn');
                const rejectBtn = card.querySelector('.reject-btn');

                approveBtn.addEventListener('click', () => submitApproval(card, event.approvalId, true));
                rejectBtn.addEventListener('click', () => submitApproval(card, event.approvalId, false));

                chatContainer.appendChild(card);
                scrollToBottom();
            }

            async function submitApproval(card, approvalId, approved) {
                const buttons = card.querySelectorAll('button');
                buttons.forEach(b => { b.disabled = true; });
                const toolName = card.dataset.toolName || '';
                const uiMeta = getApprovalUiMeta({ toolName, approvalId });

                try {
                    const response = await fetch('/ai/approve', {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({ approvalId, approved })
                    });
                    if (response.status === 401) {
                        throw new Error('未登录或 token 已失效，请重新登录并更新页面顶部 token。');
                    }
                    const body = await response.json();
                    if (!response.ok || body.code === 0) {
                        throw new Error(body.msg || ('HTTP ' + response.status));
                    }

                    const message = (body.data && body.data.message) || (approved ? '已确认' : '已取消');
                    card.className = 'mx-auto max-w-md message-enter rounded-xl border px-4 py-3 text-sm ' +
                        (approved ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-slate-200 bg-slate-50 text-slate-600');
                    card.innerHTML = (approved ? '✓ ' : '× ') + escapeHtml(message);

                    // 确认成功后，等当前 SSE 结束后再让 Agent 一句话收尾
                    if (approved) {
                        pendingFollowUp = uiMeta.approvedFollowUpPrefix + '执行结果：' + message + '。请用一句话向我确认。';
                        if (!isStreaming) {
                            const text = pendingFollowUp;
                            pendingFollowUp = null;
                            messageInput.value = text;
                            sendMessage();
                        }
                    }
                } catch (e) {
                    buttons.forEach(b => { b.disabled = false; });
                    card.insertAdjacentHTML('beforeend',
                        `<div class="text-xs text-red-500 mt-2">处理失败：${escapeHtml(e.message)}</div>`);
                }
            }

            // ========== 核心：流式请求 ==========
            async function sendMessage() {
                const text = messageInput.value.trim();
                const evidence = pendingEvidence;
                if ((!text && !evidence) || isStreaming) return;

                const previewUrl = evidence ? evidence.previewUrl : '';
                addUserMessage(text, previewUrl);

                messageInput.value = '';
                autoResizeTextarea();
                clearBtn.classList.add('hidden');
                hideEvidencePreview();

                const { wrapper, bubble } = createAiStreamBubble();
                showThinkingDots(bubble);
                currentAiBubble = bubble;
                scrollToBottom();
                setLoading(true);

                let accumulatedText = '';
                let runMetaEl = null;
                let firstDelta = true;

                try {
                    let imageUrl = '';
                    let imageBase64 = '';
                    if (evidence && evidence.file) {
                        if (evidence.file.size > 5 * 1024 * 1024) {
                            throw new Error('证据图不能超过 5MB。');
                        }
                        imageBase64 = await fileToDataUrl(evidence.file);
                        try {
                            imageUrl = await uploadEvidence(evidence.file);
                        } catch (uploadError) {
                            console.warn('OSS 上传失败，仍用本地图做视觉识别:', uploadError);
                        }
                    }

                    const response = await fetch('/ai/chat', {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify(buildPayload(text, imageUrl, imageBase64)),
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            throw new Error('未登录或 token 已失效，请重新登录并更新页面顶部 token。');
                        }
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder('utf-8');
                    let lineBuffer = '';

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        const chunkText = decoder.decode(value, { stream: true });
                        const lines = (lineBuffer + chunkText).split('\n');
                        lineBuffer = lines.pop();

                        for (const line of lines) {
                            if (!line.startsWith('data:')) continue;

                            let content = line.slice(5).trim();
                            if (content === '' || content === '[DONE]' || content === '"[DONE]"') continue;

                            if (content.startsWith('"') && content.endsWith('"')) {
                                try {
                                    content = JSON.parse(content);
                                } catch (e) {
                                    content = content.substring(1, content.length - 1);
                                }
                            }

                            const event = parseAgentEvent(content);
                            if (event) {
                                if (event.conversationId && event.conversationId !== conversationId) {
                                    conversationId = event.conversationId;
                                    localStorage.setItem(CONVERSATION_KEY, conversationId);
                                    sessionBadge.textContent = conversationId;
                                }

                                if (event.type === 'RUN_STARTED') {
                                    runMetaEl = document.createElement('div');
                                    runMetaEl.className = 'text-center text-xs text-slate-400 font-mono message-enter';
                                    runMetaEl.textContent = '▶ ' + event.runId + ' · ' + event.conversationId;
                                    chatContainer.insertBefore(runMetaEl, wrapper);
                                    scrollToBottom();
                                    continue;
                                }
                                if (event.type === 'RUN_FINISHED') {
                                    if (runMetaEl) {
                                        runMetaEl.textContent = '✓ ' + event.runId + ' 完成';
                                    }
                                    continue;
                                }
                                if (event.type === 'ERROR') {
                                    accumulatedText = event.content || '未知错误';
                                    firstDelta = false;
                                    continue;
                                }
                                if (event.type === 'APPROVAL_REQUIRED') {
                                    showApprovalCard(event);
                                    continue;
                                }
                                if (event.type === 'VISION_RESULT') {
                                    showVisionResult(event);
                                    continue;
                                }
                                if (event.type === 'TOOL_START' || event.type === 'TOOL_RESULT') {
                                    showToolTimeline(event);
                                    continue;
                                }
                                if (event.type === 'DELTA') {
                                    const piece = event.content || '';
                                    if (firstDelta) {
                                        firstDelta = false;
                                        accumulatedText = piece;
                                    } else {
                                        accumulatedText += piece;
                                    }
                                    continue;
                                }
                            }

                            if (firstDelta) {
                                firstDelta = false;
                                accumulatedText = content;
                            } else {
                                accumulatedText += content;
                            }
                        }

                        if (!firstDelta) {
                            bubble.innerHTML = simpleMarkdownToHtml(accumulatedText);
                            bubble.classList.add('typing-cursor');
                            scrollToBottom();
                        }
                    }

                    finishAiBubble(bubble);
                    bubble.innerHTML = simpleMarkdownToHtml(accumulatedText || '（无文本输出）');

                } catch (error) {
                    console.error('流式请求失败:', error);
                    bubble.classList.remove('typing-cursor');
                    bubble.innerHTML = `
                        <div class="text-red-500">
                            <i class="fa-solid fa-triangle-exclamation mr-1"></i>
                            <strong>请求失败：</strong>${escapeHtml(error.message)}
                        </div>
                        <div class="text-xs text-gray-400 mt-1">
                            请确认后端 <code>/ai/chat</code> 接口已启动并支持流式响应 (text/event-stream)
                        </div>
                    `;
                } finally {
                    setLoading(false);
                    currentAiBubble = null;
                    if (pendingFollowUp) {
                        const text = pendingFollowUp;
                        pendingFollowUp = null;
                        messageInput.value = text;
                        setTimeout(() => sendMessage(), 50);
                    }
                }
            }

            // ========== 自动调整输入框高度 ==========
            function autoResizeTextarea() {
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
            }

            function clearInput() {
                messageInput.value = '';
                autoResizeTextarea();
                clearBtn.classList.add('hidden');
                messageInput.focus();
            }

            // ========== 事件监听 ==========
            messageInput.addEventListener('input', () => {
                autoResizeTextarea();
                // 显示/隐藏清空按钮
                if (messageInput.value.length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
            });

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            attachBtn.addEventListener('click', () => evidenceInput.click());
            evidenceInput.addEventListener('change', () => {
                const file = evidenceInput.files && evidenceInput.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    setEvidenceFile(null);
                    alert('请选择图片文件。');
                    return;
                }
                setEvidenceFile(file);
            });
            removeEvidenceBtn.addEventListener('click', () => setEvidenceFile(null));

            // 发送 & 清空按钮监听（替代 HTML 行内 onclick，避免闭包作用域问题）
            sendBtn.addEventListener('click', sendMessage);
            clearBtn.addEventListener('click', clearInput);
            newSessionBtn.addEventListener('click', () => {
                if (isStreaming) return;
                resetConversation();
            });
            saveTokenBtn.addEventListener('click', () => {
                if (saveToken()) {
                    statusIndicator.innerHTML = `
                        <span class="flex items-center gap-1.5 text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full text-xs font-medium">
                            <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                            Token 已保存
                        </span>
                    `;
                }
            });

            // ========== 初始化 ==========
            function init() {
                ensureConversationId();
                if (!accessToken) {
                    accessToken = guessExistingJwt();
                    if (accessToken) {
                        localStorage.setItem(TOKEN_KEY, accessToken);
                    }
                }
                tokenInput.value = accessToken;
                addWelcomeMessage();
                messageInput.focus();
            }

            init();
        })();
    </script>
